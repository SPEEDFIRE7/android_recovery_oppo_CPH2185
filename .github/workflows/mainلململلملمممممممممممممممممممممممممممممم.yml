name: Build TWRP recovery (CPH2185)

on:
  push:
    branches: [twrp-12.1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      LC_ALL: C
    steps:
      - name: Free disk space
        shell: bash
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell \
            /usr/local/share/chromium /usr/share/miniconda /opt/microsoft /opt/az \
            /usr/lib/google-cloud-sdk /usr/lib/jvm /usr/lib/firefox \
            /usr/local/aws-cli /usr/local/aws-sam-cli /usr/local/julia* /usr/local/n \
            /opt/google /usr/local/graalvm
          sudo docker image prune -af || true
          sudo apt-get clean
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          ROOT_FREE=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          MNT_FREE=$(df --output=avail -BG /mnt 2>/dev/null | tail -1 | tr -dc 0-9)
          if [ "${MNT_FREE:-0}" -gt "${ROOT_FREE:-0}" ]; then
            sudo mkdir -p /mnt/twrp && sudo chown "$(id -u):$(id -g)" /mnt/twrp
            rm -rf "$GITHUB_WORKSPACE/twrp"; ln -sfn /mnt/twrp "$GITHUB_WORKSPACE/twrp"
          else
            mkdir -p "$GITHUB_WORKSPACE/twrp"
          fi
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 lib32z1-dev x11proto-core-dev libx11-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 bc rsync lz4 \
            libssl-dev cpio xz-utils
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "ci"
          git config --global user.email "ci@users.noreply.github.com"
          git config --global color.ui false

      - name: Restore source cache
        id: synccache
        uses: actions/cache/restore@v4
        with:
          path: twrp/.repo
          key: twrp-sync-121-v1

      - name: Sync TWRP 12.1 sources
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"
          repo init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1 --depth=1
          repo sync -c -j8 --force-sync --no-clone-bundle --no-tags
          df -h /

      - name: Save source cache
        if: steps.synccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: twrp/.repo
          key: twrp-sync-121-v1

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: twrp/device/oppo/CPH2185

      - name: Add swap
        shell: bash
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          ROOT_FREE=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          MNT_FREE=$(df --output=avail -BG /mnt 2>/dev/null | tail -1 | tr -dc 0-9)
          if [ "${MNT_FREE:-0}" -ge 26 ]; then
            SWF=/mnt/swapfile; SZ=$(( MNT_FREE - 2 ))
          else
            SWF=/swapfile; SZ=$(( ROOT_FREE - 14 ))
          fi
          [ "$SZ" -gt 28 ] && SZ=28
          if [ "$SZ" -ge 8 ]; then
            sudo fallocate -l ${SZ}G $SWF && sudo chmod 600 $SWF && sudo mkswap $SWF >/dev/null && sudo swapon $SWF
          fi
          sudo sysctl vm.swappiness=100
          df -h; swapon --show; free -h

      - name: Build recovery image
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true
          export GOGC=40 GOMEMLIMIT=11GiB GOMAXPROCS=2
          source build/envsetup.sh
          lunch twrp_CPH2185-eng
          mka adbd recoveryimage -j$(nproc --all) 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Upload recovery image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-CPH2185
          path: twrp/out/target/product/CPH2185/recovery.img
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            twrp/out/error.log
          if-no-files-found: warn

      - name: Release
        if: success()
        uses: softprops/action-gh-release@master
        with:
          tag_name: twrp-CPH2185-${{ github.run_number }}
          name: TWRP Oppo A15 CPH2185 — Build ${{ github.run_number }}
          files: twrp/out/target/product/CPH2185/recovery.img
          body: |
            TWRP build for Oppo A15 (CPH2185)
            Branch: twrp-12.1
            Build: ${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
