name: Build AERA recovery (CPH2185)

on:
  push:
    branches: [aera-16.0]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      AERA_BUILD_DEVICE: CPH2185
      LC_ALL: C
    steps:
      - name: Free disk space and add swap
        shell: bash
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
            /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/chromium \
            /usr/share/miniconda /opt/microsoft /opt/az /usr/lib/google-cloud-sdk /usr/lib/jvm /usr/lib/firefox \
            /usr/local/aws-cli /usr/local/aws-sam-cli /usr/local/julia* /usr/local/n /opt/google /usr/local/graalvm
          sudo docker image prune -af || true
          sudo apt-get clean
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          ROOT_FREE=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          MNT_FREE=$(df --output=avail -BG /mnt 2>/dev/null | tail -1 | tr -dc 0-9)
          echo "free GB after cleanup: /=${ROOT_FREE:-0} /mnt=${MNT_FREE:-0}"
          # Put the source tree + out/ on whichever disk has more room
          if [ "${MNT_FREE:-0}" -gt "${ROOT_FREE:-0}" ]; then
            sudo mkdir -p /mnt/aera && sudo chown "$(id -u):$(id -g)" /mnt/aera
            rm -rf "$GITHUB_WORKSPACE/aera"; ln -sfn /mnt/aera "$GITHUB_WORKSPACE/aera"
            BIG=/mnt; BIGFREE=$MNT_FREE
          else
            mkdir -p "$GITHUB_WORKSPACE/aera"
            BIG=/; BIGFREE=$ROOT_FREE
          fi
          echo "source tree on: $BIG ($BIGFREE GB free)"
          df -h
      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 lib32z1-dev x11proto-core-dev libx11-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 bc rsync lz4 \
            libssl-dev cpio xz-utils
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "ci"
          git config --global user.email "ci@users.noreply.github.com"
          git config --global color.ui false
      - name: Restore source cache
        id: synccache
        uses: actions/cache/restore@v4
        with:
          path: aera/.repo
          key: aera-sync-aera16-v1

      - name: Sync AERA 16.0 sources
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/aera"
          cd "$GITHUB_WORKSPACE/aera"
          repo init -u https://github.com/AERA-Recovery/android_manifest.git -b aera-16.0 --depth=1
          repo sync -c -j8 --force-sync --no-clone-bundle --no-tags
          df -h /
      - name: Save source cache
        if: steps.synccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: aera/.repo
          key: aera-sync-aera16-v1

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: aera/device/oppo/CPH2185

      - name: Prepare ci-logs branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s -o /dev/null -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs" \
            -d "{\"ref\":\"refs/heads/ci-logs\",\"sha\":\"$GITHUB_SHA\"}" || true
      - name: Disk and memory diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { df -h; swapon --show; free -m; du -sh "$GITHUB_WORKSPACE/aera/.repo" 2>/dev/null; du -sh --exclude=.repo "$GITHUB_WORKSPACE/aera" 2>/dev/null; } > "$GITHUB_WORKSPACE/build.log" 2>&1
          bash "$GITHUB_WORKSPACE/aera/device/oppo/CPH2185/.github/ci-push-log.sh"
      - name: Add disk swap for soong_build
        shell: bash
        run: |
