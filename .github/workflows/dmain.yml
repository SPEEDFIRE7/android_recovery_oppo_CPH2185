name: Sync OrangeFox Source

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Branch'
        required: true
        default: '12.1'
        type: choice
        options:
          - 12.1
          - 11.0

jobs:
  sync:
    name: Sync OrangeFox Source
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: write

    steps:
      - name: Free disk space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git aria2 tar zstd curl python3
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Configure git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Sync OrangeFox source
        run: |
          mkdir -p ${{ github.workspace }}/OrangeFox
          cd ${{ github.workspace }}/OrangeFox
          git clone https://gitlab.com/OrangeFox/sync.git -b master
          cd sync
          ./orangefox_sync.sh \
            --branch ${{ inputs.MANIFEST_BRANCH }} \
            --path ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

      - name: Compress source
        run: |
          cd ${{ github.workspace }}/OrangeFox
          tar --use-compress-program="zstd -T0 -3" \
            -cf fox_${{ inputs.MANIFEST_BRANCH }}.tar.zst \
            fox_${{ inputs.MANIFEST_BRANCH }}
          ls -lh fox_${{ inputs.MANIFEST_BRANCH }}.tar.zst

      - name: Split archive
        run: |
          cd ${{ github.workspace }}/OrangeFox
          split -b 1900m \
            fox_${{ inputs.MANIFEST_BRANCH }}.tar.zst \
            fox_${{ inputs.MANIFEST_BRANCH }}.tar.zst.part
          ls -lh fox_${{ inputs.MANIFEST_BRANCH }}.tar.zst.part*

      - name: Upload to Release
        uses: softprops/action-gh-release@master
        with:
          tag_name: ofox-source-${{ inputs.MANIFEST_BRANCH }}-${{ github.run_id }}
          name: OrangeFox Source ${{ inputs.MANIFEST_BRANCH }} — ${{ github.run_id }}
          files: |
            ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}.tar.zst.part*
          body: |
            OrangeFox source branch: ${{ inputs.MANIFEST_BRANCH }}

            **كيفية الاستخدام:**
            ```bash
            cat fox_${{ inputs.MANIFEST_BRANCH }}.tar.zst.part* > fox.tar.zst
            tar --use-compress-program="zstd -d" -xf fox.tar.zst
            ```
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
